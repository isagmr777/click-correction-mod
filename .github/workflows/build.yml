name: Build Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Geode CLI Manually
        run: |
          curl -sL https://github.com/geode-sdk/cli/releases/latest/download/geode-cli-linux.tar.gz -o geode-cli.tar.gz
          tar -xzf geode-cli.tar.gz
          chmod +x geode
          sudo mv geode /usr/local/bin/
          
      - name: Build Mod Package
        run: geode package
        
